<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
  
  <div class="relative w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl p-6 sm:p-7 text-slate-100 flex flex-col gap-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 p-0.5 shadow-md flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[9px] flex items-center justify-center">
            <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
          </div>
        </div>
        <div>
          <h3 class="text-base font-bold font-['Outfit'] text-white">
            {{ isRegister() ? 'Crear Cuenta' : 'Iniciar Sesión' }}
          </h3>
          <p class="text-[11px] text-slate-400">
            {{ isRegister() ? 'Regístrate para colaborar en proyectos UML' : 'Accede a tus proyectos y salas colaborativas' }}
          </p>
        </div>
      </div>

      <button (click)="close.emit()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold transition cursor-pointer">
        &times;
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="p-3 rounded-xl bg-rose-950/60 border border-rose-500/40 text-xs text-rose-300 flex items-start gap-2 shadow-inner">
      <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <!-- Nombre (Solo Registro) -->
      <div *ngIf="isRegister()" class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Nombre Completo</label>
        <input 
          type="text" 
          [(ngModel)]="nombre" 
          name="nombre"
          placeholder="Ej. Jairo Camacho" 
          class="w-full px-3.5 py-2 rounded-xl bg-slate-950/80 border border-slate-800 focus:border-indigo-500 text-xs text-slate-100 placeholder-slate-500 outline-none transition" />
      </div>

      <!-- Correo Electrónico -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Correo Electrónico</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          required
          placeholder="usuario@ejemplo.com" 
          class="w-full px-3.5 py-2 rounded-xl bg-slate-950/80 border border-slate-800 focus:border-indigo-500 text-xs text-slate-100 placeholder-slate-500 outline-none transition" />
      </div>

      <!-- Contraseña -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          required
          placeholder="Mínimo 6 caracteres" 
          class="w-full px-3.5 py-2 rounded-xl bg-slate-950/80 border border-slate-800 focus:border-indigo-500 text-xs text-slate-100 placeholder-slate-500 outline-none transition" />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold text-xs tracking-wide shadow-lg shadow-indigo-600/30 transition hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
        <span *ngIf="!isLoading()">{{ isRegister() ? 'Completar Registro' : 'Entrar a UML Studio' }}</span>
        <span *ngIf="isLoading()" class="flex items-center gap-2">
          <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>Procesando...</span>
        </span>
      </button>

    </form>

    <!-- Footer Switch Mode -->
    <div class="pt-3 border-t border-slate-800/60 text-center">
      <button 
        type="button" 
        (click)="toggleMode()"
        class="text-xs text-indigo-400 hover:text-indigo-300 transition font-medium cursor-pointer">
        {{ isRegister() ? '¿Ya tienes cuenta? Inicia sesión aquí' : '¿Aún no tienes cuenta? Regístrate gratis' }}
      </button>
    </div>

  </div>

</div>
