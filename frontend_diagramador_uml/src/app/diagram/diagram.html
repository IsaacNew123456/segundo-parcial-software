<div
  class="app-layout bg-slate-950 text-slate-100 h-screen w-screen flex overflow-hidden font-sans select-none relative">

  <!-- 1. PANEL IZQUIERDO FIJO: PALETA & MODELADO UML -->
  <app-side-panel #sidePanel class="h-full flex-shrink-0 z-20"></app-side-panel>

  <!-- 2. ÁREA CENTRAL: LIENZO DE DIBUJO JOINTJS -->
  <div class="canvas-wrapper flex-1 relative flex flex-col h-full overflow-hidden bg-slate-100" cdkDropListGroup>

    <!-- BARRA SUPERIOR FLOTANTE -->
    <div class="absolute top-4 left-4 right-4 z-10 flex items-center justify-between pointer-events-none">

      <!-- Chip Izquierdo: Estado de Sala & P2P -->
      <div
        class="pointer-events-auto flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl bg-white/95 border border-slate-200/90 backdrop-blur-md shadow-md text-slate-800">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-bold text-slate-800 font-['Outfit']">Lienzo Colaborativo</span>
        <span
          class="text-[10px] text-slate-500 font-mono bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">En
          Línea</span>
      </div>

      <!-- Chip Central: Acciones de la Clase Seleccionada -->
      <div *ngIf="diagramService.selectedElement() as sel"
        class="pointer-events-auto flex items-center gap-2 px-3 py-1 rounded-xl bg-white/95 border border-indigo-300 backdrop-blur-md shadow-xl text-slate-800 animate-fadeIn">
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-ping"></span>
        <span class="text-xs font-bold font-mono text-indigo-950">{{ sel.get('name') || 'Entidad' }}</span>
        <button (click)="openEditorForSelected()" title="Abrir editor guiado de atributos y métodos (F2 o doble clic)"
          class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-sm cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
          </svg><span>Editar Propiedades</span>
        </button>
      </div>

      <!-- Botones Superiores Derechos: Chat Grupal & Exportación -->
      <div class="pointer-events-auto flex items-center gap-2">
        <button *ngIf="projectId() as pId" (click)="toggleChat()" title="Chat Grupal en Tiempo Real"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-white text-xs font-semibold shadow-md backdrop-blur-md transition hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
          <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a.75.75 0 01-1.074-.85 5.97 5.97 0 011.02-2.316C4.12 16.48 3 14.37 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
          </svg>
          <span>Chat Grupal</span>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </button>

        <button (click)="sidePanel.toggleRightDrawer()"
          class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-[0.98] transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg><span>Exportar & Herramientas</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
          </svg>
        </button>
      </div>
    </div>


    <!-- CONTENEDOR DEL LIENZO SVG (JOINTJS) -->
    <div #paperContainer class="diagram-container flex-1 w-full h-full cursor-default" cdkDropList>
      <!-- JointJS Canvas -->
    </div>

    <!-- WIDGET FLOTANTE DE ZOOM (Esquina Inferior Derecha) -->
    <div
      class="absolute bottom-5 right-5 z-10 flex items-center gap-1 p-1.5 rounded-2xl bg-white/95 border border-slate-200 backdrop-blur-md shadow-xl text-slate-700">
      <button (click)="zoomIn()" title="Acercar (Zoom In)"
        class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-sm font-bold transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </button>

      <button (click)="zoomOut()" title="Alejar (Zoom Out)"
        class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-sm font-bold transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
        </svg>
      </button>

      <div class="w-[1px] h-4 bg-slate-300 mx-0.5"></div>

      <button (click)="resetZoom()" title="Restablecer Zoom (100%)"
        class="px-2.5 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-xs font-semibold font-mono transition active:scale-95 cursor-pointer">
        100%
      </button>
    </div>

  </div>

  <!-- MODAL ASISTIDO DE PROPIEDADES DE CLASE UML (DROPDOWNS & VISIBILIDAD) -->
  <app-class-editor-modal (save)="onSaveClassProperties($event)"></app-class-editor-modal>

  <!-- PANEL DERECHO DESLIZABLE: CHAT GRUPAL EN TIEMPO REAL -->
  <div *ngIf="showChat() && projectId() as pId"
    class="fixed inset-y-0 right-0 z-40 w-88 bg-slate-950/95 border-l border-slate-800 shadow-2xl backdrop-blur-2xl flex flex-col animate-slideIn">

    <div class="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a.75.75 0 01-1.074-.85 5.97 5.97 0 011.02-2.316C4.12 16.48 3 14.37 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
        </svg>
        <span class="text-sm font-bold font-['Outfit'] text-white">Canal Grupal</span>
      </div>
      <button (click)="toggleChat()"
        class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-base font-bold transition cursor-pointer">&times;</button>
    </div>

    <div class="flex-1 overflow-hidden">
      <app-group-chat [projectId]="pId"></app-group-chat>
    </div>
  </div>

</div>
